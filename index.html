<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>converter kilometers to miles</title>
    <link rel="stylesheet" href="styles.css"> 
</head>
<body>
    <div class="converter-container">
        <h1>converter kilometers to miles </h1>
        
        <label for="kilometersInput">Enter the distance in kilometers:</label>
        <input type="number" id="kilometersInput" placeholder="Enter the value here" min="0" required> <div class="buttons-group">
            <button id="convertButton">Convert to miles</button> <button id="clearButton">clear</button> </div>
        
        <div class="result-area">
            <h2>The result in miles</h2>
            <p id="milesResult">--</p> </div>

        <p id="error-message" class="error-text"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
